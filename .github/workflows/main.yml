# =====================================================================
# 小米6 (sagit / msm8998 / 4.4.253-perf 非 GKI) 带 KSU 内核云编译
#
# 用法：把本套件整体推送为你自己的 GitHub 仓库（README.md、repack_boot.py、
#       ksu_hooks_patch.py、local_build.sh 放仓库根目录，.github/workflows/ 随之生效），
#       然后在 Actions 页面手动触发（workflow_dispatch），或直接 push 到 main 分支。
#
# 两种 KSU 集成方式（ksu_type 参数）：
#   sukisu-builtin  SukiSU-Ultra builtin 分支（默认，推荐）：
#                   无 kprobe 依赖，专供手动集成，Kconfig 的 CONFIG_KSU 无 depends。
#   tiann-0.9.5     tiann/KernelSU v0.9.5（非 GKI 官方最后支持版，回退方案）。
#
# 所有 hook 补丁由 ksu_hooks_patch.py 完成，签名均核对自官方文档与 builtin 分支源码。
# =====================================================================

name: build-sagit-kernel-ksu

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核源码仓库（owner/repo）'
        required: false
        default: 'MiCode/Xiaomi_Kernel_OpenSource'
      kernel_branch:
        description: '内核源码分支'
        required: false
        default: 'sagit-p-oss'
      kernel_defconfig:
        description: 'defconfig（arch/arm64/configs/ 下的文件名）'
        required: false
        default: 'sagit_user_defconfig'
      dtb_name:
        description: 'DTB 文件名（out/arch/arm64/boot/dts/qcom/ 下）'
        required: false
        default: 'sagit-msm8998-v2.1-mtp.dtb'
      ksu_type:
        description: 'KSU 集成方式'
        required: false
        default: 'sukisu-builtin'
        type: choice
        options:
          - sukisu-builtin
          - tiann-0.9.5
      boot_img_url:
        description: '可选：原 boot.img 直链（提供则自动重打包出可直接刷写的 boot_ksu.img）'
        required: false
        default: ''
  push:
    branches: [ main, master ]

env:
  # push 触发时取默认值，dispatch 触发时取输入值（|| 兜底写法）
  KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'MiCode/Xiaomi_Kernel_OpenSource' }}
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'sagit-p-oss' }}
  DEFCONFIG: ${{ github.event.inputs.kernel_defconfig || 'sagit_user_defconfig' }}
  DTB_NAME: ${{ github.event.inputs.dtb_name || 'sagit-msm8998-v2.1-mtp.dtb' }}
  KSU_TYPE: ${{ github.event.inputs.ksu_type || 'sukisu-builtin' }}
  BOOT_IMG_URL: ${{ github.event.inputs.boot_img_url || '' }}
  # proton clang：20210522 release = clang 13.0.0 + binutils 2.36.1，
  # 与现役内核（4.4.253-perf-g337fdc9b0a58，proton clang 13.0.0 编译）工具链一致
  TOOLCHAIN_URL: 'https://github.com/kdrag0n/proton-clang'
  TOOLCHAIN_TAG: '20210522'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取本套件（repack_boot.py / ksu_hooks_patch.py）
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev \
            pkg-config libelf-dev \
            python3 python3-dev cpio zip curl wget git

      - name: 拉取内核源码（${{ env.KERNEL_REPO }} @ ${{ env.KERNEL_BRANCH }}）
        run: |
          git clone --depth=1 -b "${KERNEL_BRANCH}" \
            "https://github.com/${KERNEL_REPO}" kernel_src
          cd kernel_src
          echo "--- 确认关键源文件存在 ---"
          test -f "arch/arm64/configs/${DEFCONFIG}" || { echo "defconfig 不存在：${DEFCONFIG}"; exit 1; }
          test -f fs/exec.c && test -f fs/open.c && test -f fs/stat.c

      - name: 拉取 proton clang 工具链（tag ${{ env.TOOLCHAIN_TAG }}）
        run: |
          git clone --depth=1 -b "${TOOLCHAIN_TAG}" "${TOOLCHAIN_URL}" proton-clang
          ./proton-clang/bin/clang --version | head -n 2

      - name: 修复 4.4 dtc 在新宿主 gcc（-fno-common）下的 yylloc 重定义
        run: |
          cd kernel_src
          # Ubuntu 22.04 宿主 gcc 默认 -fno-common，4.4 自带 dtc 的
          # dtc-lexer 与 dtc-parser 重复定义 yylloc，链接报 multiple definition。
          # 标准修法：改成 extern 声明（与上游 dtc 修复提交一致）。
          # 注意构建实际使用 SHIPPED 预生成文件，两处都要打。
          for f in scripts/dtc/dtc-lexer.l scripts/dtc/dtc-lexer.lex.c_shipped; do
            if [ -f "$f" ] && grep -q '^YYLTYPE yylloc;' "$f"; then
              sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f"
              echo "patched: $f"
            else
              echo "skip (未匹配，可能已修): $f"
            fi
          done
          grep -n 'yylloc' scripts/dtc/dtc-lexer.lex.c_shipped | head -n 3

      - name: 摘除厂商驱动的 -Werror（clang 13 严格告警拦截）
        run: |
          cd kernel_src
          # tfa98xx（-Wself-assign/-Wenum-conversion）和 elliptic（-Wsometimes-uninitialized）
          # 的 Makefile 写死 -Werror，clang 13 下纯告警也会断编译。统一处理：
          # -Werror=xxx -> -Wno-error=xxx；裸 -Werror 删除。警告保留可见，不再拦路。
          grep -rIl --include='Makefile' --include='Kbuild' --include='*.mak' -- '-Werror' . | while read -r f; do
            # 三种形态都要处理：-Werror=xxx / -Werror-xxx / 裸 -Werror
            # （上一轮漏了连字符形态，导致 -Werror-implicit-function-declaration 变成非法参数）
            sed -i \
              -e 's/-Werror=\([a-zA-Z0-9_-]*\)/-Wno-error=\1/g' \
              -e 's/-Werror-\([a-zA-Z0-9_-]*\)/-Wno-error=\1/g' \
              -e 's/-Werror//g' "$f"
            echo "cleaned: $f"
          done
          echo "剩余 -Werror: $(grep -rI --include='Makefile' --include='Kbuild' --include='*.mak' -- '-Werror' . | wc -l)"
          echo "残留非法参数检查: $(grep -rI --include='Makefile' --include='Kbuild' -- ' -[a-z]*-implicit' . | head -n 3)"

      - name: 集成 KSU 源码（setup.sh -> drivers/kernelsu）
        run: |
          cd kernel_src
          if [ "${KSU_TYPE}" = "tiann-0.9.5" ]; then
            # tiann/KernelSU：非 GKI 最后官方支持版是 v0.9.5（v1.0 起放弃非 GKI）
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
              | bash -s v0.9.5
          else
            # SukiSU-Ultra builtin 分支：无 kprobe 的手动钩子设计（本套件默认）
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
              | bash -s builtin
          fi
          test -d drivers/kernelsu || { echo "drivers/kernelsu 未创建，setup.sh 失败"; exit 1; }
          # 4.4 兼容补丁：上游 kernel_includes.h 无条件 include linux/static_call.h，
          # 该头文件 5.10 才存在；全库检索确认代码无任何 static_call 调用，属死引入，
          # 用版本保护包起来（5.10+ 内核仍可用）。
          # 注意：drivers/kernelsu 是指向 KernelSU/kernel 的符号链接，
          # 必须解析真实路径再 sed -i（直接对符号链接 -i 会把链接替换成普通文件）。
          INC="$(readlink -f drivers/kernelsu/kernel_includes.h)"
          test -f "$INC" || { echo "kernel_includes.h 未找到（实际路径解析失败）：$INC"; ls -l drivers/kernelsu/ | head; exit 1; }
          sed -i 's|^#include <linux/static_call.h>$|#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n#include <linux/static_call.h>\n#endif|' "$INC"
          echo "已修补: $INC"
          grep -n -A1 -B1 'static_call' "$INC" | head -n 5
          # 兼容补丁 2：上游 kernel_compat.h 把 static key API 的版本下限写成 4.3，
          # 但 DECLARE_STATIC_KEY_FALSE 是 4.5+/4.6 才进内核的；4.4 上选错分支导致
          # "a parameter list without types"。把下限抬到 4.6，4.4 走上游维护的
          # fallback 分支（bool + WRITE_ONCE，功能等价）。
          COMPAT="$(readlink -f drivers/kernelsu/kernel_compat.h)"
          test -f "$COMPAT" || { echo "kernel_compat.h 未找到"; exit 1; }
          sed -i 's/KERNEL_VERSION(4, 3, 0)/KERNEL_VERSION(4, 6, 0)/' "$COMPAT"
          echo "已修补 static key 版本下限: $COMPAT"
          grep -n 'KERNEL_VERSION(4, 6, 0)' "$COMPAT" | head -n 3
          # 兼容补丁 3：cpu_spoof.c 依赖 5.6+ 的 vdso/datapage.h 等 vDSO 内部接口，
          # 4.4 无对应实现；该功能是可选的反检测扩展，置 0 后上游自带的
          # "subsystem missing" 降级路径生效（调用返回 -ENXIO，无害）。
          # 注意行尾挂着 || defined(__aarch64__)，必须整行替换而不是只换前半。
          CS="$(readlink -f drivers/kernelsu/extension/cpu_spoof.c)"
          test -f "$CS" || { echo "cpu_spoof.c 未找到"; exit 1; }
          sed -i '/^#if defined(CONFIG_ARM64)/c\#if 0' "$CS"
          echo "已禁用 cpu_spoof ARM64 专属代码: $CS"
          grep -n '#if 0' "$CS" | head -n 5
          # 兼容补丁 4：上游 Makefile 用 DEFINE_STATIC_KEY_TRUE 探测新式 static key
          # API，但代码实际使用 DECLARE_STATIC_KEY_FALSE（4.6 才有）——探测与使用
          # 不一致，4.4 上探测命中却编不过，且以 -D 注入绕过 kernel_compat.h 的
          # 版本下限。把探测串改成实际使用的 API 名，4.4 上探测失败即走 fallback。
          MKF="$(readlink -f drivers/kernelsu/Makefile)"
          test -f "$MKF" || { echo "kernelsu Makefile 未找到"; exit 1; }
          sed -i 's/DEFINE_STATIC_KEY_TRUE/DECLARE_STATIC_KEY_FALSE/g' "$MKF"
          echo "已修正 Makefile static key 探测: $MKF"
          grep -n 'DECLARE_STATIC_KEY_FALSE' "$MKF" | head -n 3

      - name: 打手动集成 hook 补丁（ksu_hooks_patch.py）
        run: |
          python3 ksu_hooks_patch.py --mode "${KSU_TYPE}" --src kernel_src

      - name: 向 defconfig 追加 KSU CONFIG
        run: |
          cd kernel_src
          DEF="arch/arm64/configs/${DEFCONFIG}"
          cp "$DEF" "${DEF}.bak"
          grep -q '^CONFIG_KSU=y' "$DEF" || printf '\n# ==== KernelSU（CI 追加，手动集成无 kprobe） ====\nCONFIG_KSU=y\n' >> "$DEF"
          if [ "${KSU_TYPE}" = "sukisu-builtin" ]; then
            # 仅 SukiSU builtin 的 Kconfig 里存在该符号；tiann 版追加会被忽略，故按模式区分
            grep -q '^CONFIG_KSU_FEATURE_ADBROOT=y' "$DEF" || printf 'CONFIG_KSU_FEATURE_ADBROOT=y\n' >> "$DEF"
          fi
          # 显式关闭 SUSFS：上游 Kconfig 里 KSU_SUSFS default y 且 depends on
          # THREAD_INFO_IN_TASK——4.4 内核根本没有这个符号，Kconfig 对不存在的
          # 依赖按满足处理，SUSFS 会被默认打开并 include 不存在的 linux/susfs.h。
          # 必须用规范写法显式置否（sub-option 全部随之关闭）。
          grep -q 'CONFIG_KSU_SUSFS' "$DEF" || printf '# CONFIG_KSU_SUSFS is not set\n' >> "$DEF"
          # 关闭模块签名：Android ROM 不加载签名 .ko，而 4.4 的 sign-file/extract-cert
          # 宿主工具在 OpenSSL 3（Ubuntu 22.04）下编译/链接脆弱，是 scripts 阶段暴雷重灾区
          if grep -q '^CONFIG_MODULE_SIG=y' "$DEF"; then
            sed -i 's/^CONFIG_MODULE_SIG=y/CONFIG_MODULE_SIG=n/' "$DEF"
          fi
          grep -q '^CONFIG_MODULE_SIG=n' "$DEF" || printf 'CONFIG_MODULE_SIG=n\n' >> "$DEF"
          tail -n 8 "$DEF"

      - name: defconfig + 编译 Image.gz 与 dtbs
        run: |
          cd kernel_src
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          # CC=clang 由命令行传入：sagit-p-oss 顶层 Makefile 默认 CC=scripts/gcc-wrapper.py
          # （python2），命令行覆盖既绕过 wrapper 又直接启用 proton clang，
          # 这正是现役内核的构建方式（内核版本串含 "proton clang 13.0.0"）
          MAKE="make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          $MAKE "${DEFCONFIG}"
          # 确认 CONFIG_KSU 真的生效（防止 kconfig 依赖把 KSU 静默丢掉）
          grep -q '^CONFIG_KSU=y' out/.config || { echo "CONFIG_KSU 未生效！检查 out/.config"; exit 1; }
          # 防线：SUSFS 未集成内核补丁，绝不能开（详见 defconfig 步骤注释）
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config && { echo "CONFIG_KSU_SUSFS 意外开启！4.4 无 susfs.h"; exit 1; }
          echo "CONFIG_KSU=$(grep -c '^CONFIG_KSU=y' out/.config) SUSFS=$(grep -c '^CONFIG_KSU_SUSFS=y' out/.config || true)"
          # 完整保留日志（旧内核并行编译时真正报错常被 tail 截掉，失败时靠 build.log 定位）
          set -o pipefail
          $MAKE -j"$(nproc)" Image.gz dtbs 2>&1 | tee build.log
          echo "--- 编译产物 ---"
          ls -l out/arch/arm64/boot/Image.gz
          test -f "out/arch/arm64/boot/dts/qcom/${DTB_NAME}" \
            || { echo "DTB 未生成：out/arch/arm64/boot/dts/qcom/${DTB_NAME}"; exit 1; }

      - name: 失败时上传完整编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel_src/build.log
          if-no-files-found: ignore

      - name: 拼接 Image.gz-dtb（sagit 无 dtbo，内核为 gzip 流 + 单 DTB 拼接）
        run: |
          cd kernel_src
          cat out/arch/arm64/boot/Image.gz \
              "out/arch/arm64/boot/dts/qcom/${DTB_NAME}" \
              > out/Image.gz-dtb
          ls -l out/Image.gz-dtb
          # 校验：必须以 gzip 魔数 1f 8b 开头（与原厂 Image.gz-dtb 结构一致）
          head -c 2 out/Image.gz-dtb | od -A n -t x1 | grep -q "1f 8b" \
            || { echo "Image.gz-dtb 开头不是 gzip 魔数"; exit 1; }

      - name: 重打包 boot.img（可选，需提供 boot_img_url）
        if: ${{ env.BOOT_IMG_URL != '' }}
        run: |
          curl -fL --retry 3 -o base_boot.img "${BOOT_IMG_URL}"
          python3 repack_boot.py \
            --kernel kernel_src/out/Image.gz-dtb \
            --base base_boot.img \
            --out boot_ksu.img

      - name: 汇总产物
        run: |
          mkdir -p artifacts
          cp kernel_src/out/Image.gz-dtb artifacts/
          cp kernel_src/out/.config artifacts/kernel_config_ksu.txt
          # 原样保留原 defconfig 备份，便于核对 CI 追加项
          cp "kernel_src/arch/arm64/configs/${DEFCONFIG}.bak" artifacts/defconfig.orig 2>/dev/null || true
          if [ -f boot_ksu.img ]; then cp boot_ksu.img artifacts/; fi
          {
            echo "kernel: ${KERNEL_REPO}@${KERNEL_BRANCH}"
            echo "defconfig: ${DEFCONFIG}"
            echo "dtb: ${DTB_NAME}"
            echo "ksu_type: ${KSU_TYPE}"
            echo "date: $(date -u)"
          } > artifacts/BUILD_INFO.txt
          ls -l artifacts

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: sagit-ksu-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
